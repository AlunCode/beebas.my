name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 0 */2 * *"  # setiap 2 hari
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Supabase
        run: |
          curl -X GET "https://qwhcqfwsjzsamrtyudlq.supabase.co/rest/v1/users?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_API_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_API_KEY }}" \
            -H "Accept: application/json" \
            --max-time 10 \
            --fail